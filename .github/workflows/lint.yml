name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    # macos required: go-eventkit uses cgo + Objective-C to link Apple frameworks (EventKit, Foundation, AppKit, CoreLocation)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
        with:
          cache: true
          install: true
      - name: golangci-lint
        run: make lint
