name: Release

on:
  push:
    tags:
      - "v0.[1-9][0-9][0-9]*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in build-only artifacts
        required: true
        default: v0.100.0-test

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: false
          install: true

      - name: Select version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          TEST_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$TEST_VERSION"
          fi
          if [[ ! "$VERSION" =~ ^v0\.[1-9][0-9]{2,}\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid fork release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify module identity
        run: make check-module

      - name: Lint GitHub Actions
        run: make lint-actions

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make release

      - name: Verify release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in arm64 amd64; do
            archive="bin/ical-darwin-${arch}.tar.gz"
            test "$(tar -tzf "$archive")" = "ical"
            extract_dir="$(mktemp -d)"
            tar -xzf "$archive" -C "$extract_dir"
            expected_arch="$arch"
            if [[ "$arch" == "amd64" ]]; then
              expected_arch=x86_64
            fi
            test "$(lipo -archs "$extract_dir/ical")" = "$expected_arch"
            rm -rf "$extract_dir"
          done

          case "$(uname -m)" in
            arm64) native_arch=arm64 ;;
            x86_64) native_arch=amd64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          native_dir="$(mktemp -d)"
          tar -xzf "bin/ical-darwin-${native_arch}.tar.gz" -C "$native_dir"
          "$native_dir/ical" version | grep -F "ical ${VERSION} "
          rm -rf "$native_dir"
          cd bin
          shasum -a 256 -c SHA256SUMS

      - name: Retain build-only artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ical-${{ steps.version.outputs.version }}
          path: |
            bin/ical-darwin-arm64.tar.gz
            bin/ical-darwin-amd64.tar.gz
            bin/SHA256SUMS
          if-no-files-found: error

      - name: Stage release assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            bin/ical-darwin-arm64.tar.gz
            bin/ical-darwin-amd64.tar.gz
            bin/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          start_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$start_tag" ]]; then
            start_tag=v0.12.2
          fi
          printf -v notes 'Install with:\n\n```bash\ngo install github.com/counterposition/ical/cmd/ical@%s\n```\n\nPrebuilt binaries for Apple Silicon and Intel Macs are attached.' "$TAG_NAME"
          gh release create "$TAG_NAME" \
            release-assets/ical-darwin-arm64.tar.gz \
            release-assets/ical-darwin-amd64.tar.gz \
            release-assets/SHA256SUMS \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes \
            --notes-start-tag "$start_tag" \
            --notes "$notes"
